name: Weekly Traffic Summary

on:
  schedule:
    # Runs every Sunday at 04:00 UTC (09:30 AM IST)
    - cron: '0 4 * * 0'
  workflow_dispatch:

jobs:
  dispatch-summary:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run Telemetry Dispatcher
        run: node scripts/send-weekly-summary.js
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          POSTHOG_PERSONAL_API_KEY: ${{ secrets.POSTHOG_PERSONAL_API_KEY }}
          POSTHOG_PROJECT_ID: ${{ secrets.POSTHOG_PROJECT_ID || '@current' }}
          POSTHOG_HOST: ${{ secrets.POSTHOG_HOST || 'https://us.i.posthog.com' }}

